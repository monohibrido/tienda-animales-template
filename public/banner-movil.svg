  </g>

  <g font-family="Helvetica, Arial, sans-serif" fill="#F1EEE3" text-anchor="middle">
    <text x="400" y="330" font-size="22" letter-spacing="8" opacity="0.8">FOTO DE PORTADA · CELULAR</text>
