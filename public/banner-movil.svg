  </defs>
  <rect width="800" height="900" fill="url(#g)"/>
  <rect x="20" y="20" width="760" height="860" fill="none" stroke="#F1EEE3" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="14 10"/>

  <g fill="#D9A441" fill-opacity="0.14">
